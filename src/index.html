<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Bipsy - Reservas de Barbería, Peluquería y Estética</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Encuentra negocios de belleza y bienestar cerca de ti y pide cita en unos toques, sin llamar.">

  <!-- Vista previa al compartir un enlace (WhatsApp, Mensajes, redes).
       Va aquí y no en Angular: quien la lee no ejecuta JavaScript, así que
       solo ve este HTML. Es la misma para todas las páginas; la de cada
       negocio, con su nombre y su foto, necesita que el servidor la genere.
       La imagen va con la URL entera porque así lo exigen: una relativa no
       se carga. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bipsy">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Bipsy · Pide cita sin llamar">
  <meta property="og:description" content="Encuentra negocios de belleza y bienestar cerca de ti y pide cita en unos toques.">
  <meta property="og:image" content="https://bipsy.es/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logotipo de Bipsy">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="theme-color" content="#23282E" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ECEEED" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">

  <!-- Solo los pesos que usa la web (400-800, sin cursivas: el único texto
       inclinado es el del titular, en Bricolage). Antes se pedían también el
       300 y dos cursivas que no salían en ninguna página. -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
  <!-- Los iconos, acotados a los ejes que se usan: grosor 400-500 y sin
       GRAD. La fuente variable completa (grosor 100-700 y GRAD -50..200) es
       varias veces más pesada. `block` y no `swap`: mientras llega, un icono
       no debe pintarse como la palabra «arrow_forward». -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..500,0..1,0&display=block" rel="stylesheet">
</head>

</body>
</html>
