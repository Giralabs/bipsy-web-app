<section class="status anim-fade-up">

  @if (fullPage) {
    <picture>
      <source media="(prefers-color-scheme: light)" srcset="assets_web/bipsy-horizontal-carbon.webp" />
      <img src="assets_web/bipsy-horizontal-mint.webp" alt="Bipsy" class="status__brand" width="122" height="34" />
    </picture>
  }

  <div class="status__body">
    <!-- Decorativo: lo que hay que saber lo dice el titular. -->
    <div class="status__art" aria-hidden="true">
      <span class="status__disc"></span>
      @if (rigged) {
        <!-- El del escritorio se mueve por piezas, sin subir ni bajar. -->
        <app-bip-rig class="status__mascot status__mascot--rig" />
      } @else {
        <img [src]="mascotSrc" alt="" class="status__mascot" />
      }
    </div>

    @if (eyebrow) {
      <p class="status__eyebrow">{{ eyebrow }}</p>
    }
    <h1 class="status__title">{{ heading }}</h1>
    @if (lead) {
      <p class="status__lead">{{ lead }}</p>
    }

    <div class="status__extra"><ng-content></ng-content></div>

    <div class="status__actions"><ng-content select="[statusActions]"></ng-content></div>

    <p class="status__note"><ng-content select="[statusNote]"></ng-content></p>
  </div>
</section>
