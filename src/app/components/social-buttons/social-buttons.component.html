<!-- Botones propios y no `app-button`: ni el logotipo de Google ni el de Apple
     se pueden sustituir por un icono, y sus guías de marca fijan el color de
     cada uno (blanco y negro). Es lo que los hace reconocibles. -->
<div class="social-btns">
  @if (googleAvailable) {
    <button
      type="button"
      class="google-btn"
      [disabled]="disabled || busy !== null"
      (click)="chosen.emit('google')"
    >
      @if (busy === 'google') {
        <span class="btn-spinner"></span>
      } @else {
        <svg class="google-btn__logo" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continuar con Google
      }
    </button>
  }

  @if (appleAvailable) {
    <button
      type="button"
      class="apple-btn"
      [disabled]="disabled || busy !== null"
      (click)="chosen.emit('apple')"
    >
      @if (busy === 'apple') {
        <span class="btn-spinner"></span>
      } @else {
        <svg class="apple-btn__logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.05 12.54c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.09-2.01-3.76-2.04-1.6-.16-3.12.94-3.93.94-.81 0-2.06-.92-3.39-.9-1.74.03-3.35 1.01-4.25 2.57-1.81 3.14-.46 7.79 1.3 10.34.86 1.25 1.88 2.65 3.23 2.6 1.3-.05 1.79-.84 3.36-.84 1.57 0 2.01.84 3.38.81 1.4-.02 2.28-1.27 3.13-2.53.99-1.45 1.4-2.86 1.42-2.93-.03-.01-2.72-1.04-2.75-4.13M14.5 4.76c.71-.87 1.19-2.07 1.06-3.27-1.02.04-2.27.69-3.01 1.55-.66.76-1.24 1.99-1.08 3.16 1.14.09 2.31-.58 3.03-1.44"/>
        </svg>
        Continuar con Apple
      }
    </button>
  }
</div>
