@if (!dismissed) {
  <aside class="promobar">
    <a class="promobar__cta" [href]="businessUrl">
      <span class="material-symbols-rounded promobar__icon" aria-hidden="true">storefront</span>
      <span class="promobar__text">
        Añade ya tu negocio a Bipsy
        <strong>{{ trialLabel }}</strong>
      </span>
      <span class="material-symbols-rounded promobar__arrow" aria-hidden="true">arrow_forward</span>
    </a>

    <button type="button" class="promobar__close" (click)="dismiss()" aria-label="Ocultar el aviso">
      <span class="material-symbols-rounded">close</span>
    </button>
  </aside>
}
