<div class="sheet-backdrop" (click)="close()">
  <div class="sheet" (click)="$event.stopPropagation()" role="dialog" aria-label="Añadir tarjeta">
    <h2 class="sheet__title">Añadir tarjeta</h2>
    <p class="sheet__sub">
      {{ reason || 'Tu banco puede pedirte confirmarla. Se hace ahora, una sola vez, y así los cobros posteriores no te interrumpen.' }}
    </p>

    <!-- El formulario lo pinta Stripe dentro de su propio iframe. -->
    <div class="pay__element" #cardHost></div>

    <!-- Sin marcar por defecto: guardar la tarjeta de alguien es una decisión,
         no lo que pasa si no haces nada. Y el texto dice lo que de verdad
         significa no marcarla, porque «no guardar» se lee como «se borra al
         salir» y no es eso: sigue siendo la garantía de ESTA cita. -->
    <label class="card__keep">
      <input type="checkbox" [(ngModel)]="keepSaved" />
      <span>
        <strong>Guardar para próximas reservas</strong>
        <small>
          Si no la guardas, se usa solo para esta cita y se retira cuando deje de
          poder generar un cargo.
        </small>
      </span>
    </label>

    @if (error) {
      <p class="flow__error" role="alert">
        <span class="material-symbols-rounded fill">error</span>{{ error }}
      </p>
    }

    <div class="sheet__actions">
      <app-button variant="primary" [fullWidth]="true" [loading]="busy" (onClick)="submit()">
        Guardar tarjeta
      </app-button>
      <app-button variant="ghost" [fullWidth]="true" (onClick)="close()">Cancelar</app-button>
    </div>
  </div>
</div>
