<!-- Sin botón de cerrar: el aviso se queda. Quien reserva desde el navegador
     es justamente a quien hay que decirle que existe la app. -->
<!-- Solo si la tienda de este sistema ya tiene ficha: hoy, en iPhone sí y en
     Android todavía no. Una tira con el botón en «Próximamente» delataba una
     web a medias. -->
@if (linkReady) {
<aside class="appbanner">
  <!-- El símbolo sobre fondo, como se ve el icono en la pantalla de inicio. -->
  <span class="appbanner__icon" aria-hidden="true">
    <picture>
      <!-- Los de `assets_web/`: la ruta del kit lleva un espacio («Brand Marks»)
           y en un `srcset` el espacio separa la URL del descriptor, así que el
           navegador descartaba el símbolo del modo claro. -->
      <source media="(prefers-color-scheme: light)" srcset="assets_web/bipsy-symbol-carbon.webp" />
      <img src="assets_web/bipsy-symbol-mint.webp" alt="" />
    </picture>
  </span>

  <span class="appbanner__text">
    <strong>Bipsy</strong>
    <small>Pide cita sin llamar, desde la app</small>
  </span>

  <a class="appbanner__go" [href]="store.url" target="_blank" rel="noopener">Obtener</a>
</aside>
}
