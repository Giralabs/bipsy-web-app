<header class="sheader" [class.sheader--visible]="visible" [attr.aria-hidden]="!visible">
  <div class="sheader__inner">

    <!-- ── Marca ── -->
    <a routerLink="/home" class="sheader__logo" aria-label="Bipsy · inicio">
      <img src="assets_bipsy/Combination Marks/combinationmark_mint_horizontal_nobackground.webp"
           alt="Bipsy" class="theme-dark-only" />
      <img src="assets_bipsy/Combination Marks/combinationmark_carbon_horizontal_nobackground.webp"
           alt="Bipsy" class="theme-light-only" />
    </a>

    <app-search-bar />

    <!-- ── Sesión ── -->
    <div class="sheader__actions">
      @if (session.currentUser; as user) {
        <a routerLink="/profile" class="sheader__avatar" [title]="user.name || 'Mi perfil'">
          @if (user.profileImageUrl) {
            <img [src]="user.profileImageUrl" [alt]="user.name || 'Mi perfil'" />
          } @else {
            <span class="material-symbols-rounded">person</span>
          }
        </a>
      } @else {
        <a routerLink="/acceder" class="sheader__login">Iniciar sesión</a>
      }
    </div>
  </div>

</header>
