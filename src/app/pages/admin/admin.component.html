@switch (view()) {
  @case ('form') {
    <div class="flow anim-fade-up">
      <div class="flow__inner">

        <img src="assets_bipsy/Combination Marks/combinationmark_mint_vertical_nobackground.webp"
             alt="Bipsy" class="flow__logo theme-dark-only" />
        <img src="assets_bipsy/Combination Marks/combinationmark_carbon_vertical_nobackground.webp"
             alt="Bipsy" class="flow__logo theme-light-only" />

        <h1 class="flow__title">Acceso del equipo</h1>
        <p class="flow__subtitle">
          Bipsy está en mantenimiento. Con la contraseña del equipo puedes entrar mientras tanto.
        </p>

        <form (submit)="submit(); $event.preventDefault()" novalidate>
          <div class="form-group">
            <div class="form-group__box">
              <div class="form-row form-row--with-eye">
                <label class="form-row__label" for="admin-pass">Contraseña</label>
                <input
                  id="admin-pass"
                  class="form-row__input"
                  [type]="showPassword ? 'text' : 'password'"
                  name="password"
                  autocomplete="current-password"
                  placeholder="la del equipo"
                  maxlength="200"
                  [disabled]="loading"
                  [(ngModel)]="password"
                />
                <button
                  type="button"
                  class="form-row__eye"
                  [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Ver contraseña'"
                  (click)="showPassword = !showPassword"
                >
                  <span class="material-symbols-rounded">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
                </button>
              </div>
            </div>
          </div>

          @if (error) {
            <p class="flow__error" role="alert">
              <span class="material-symbols-rounded fill">error</span>{{ error }}
            </p>
          }

          <div class="flow__actions">
            <app-button type="submit" variant="primary" size="large" [fullWidth]="true" [loading]="loading">
              Entrar
            </app-button>
          </div>
        </form>

      </div>
    </div>
  }

  @case ('leaving') {
    <!-- Con pase ya se está saliendo hacia la portada: no se pinta nada, que un
         parpadeo de la página no encontrada en el camino solo confunde. -->
  }

  @default {
    <app-not-found></app-not-found>
  }
}
